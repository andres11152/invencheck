services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: invencheck
      POSTGRES_PASSWORD: invencheck
      POSTGRES_DB: invencheck
    ports:
      - '5432:5432'
    volumes:
      - invencheck_postgres_data:/var/lib/postgresql/data

volumes:
  invencheck_postgres_data:
