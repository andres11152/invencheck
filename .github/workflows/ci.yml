name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: invencheck
          POSTGRES_PASSWORD: invencheck
          POSTGRES_DB: invencheck_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Instala las 3 workspaces (shared/client/server) de una sola vez y
      # dispara `postinstall: prisma generate` en server, del que dependen
      # el typecheck y el build.
      - run: npm ci

      - name: shared — build
        run: npm run build -w shared

      - name: server — lint
        run: npm run lint -w server
      - name: server — typecheck
        run: npx tsc --noEmit -p server
      - name: server — unit tests (con umbral de cobertura)
        run: npm run test:cov -w server
      - name: server — build
        run: npm run build -w server
      - name: server — e2e tests
        run: npm run test:e2e -w server
        env:
          DATABASE_URL: postgresql://invencheck:invencheck@localhost:5432/invencheck_test?schema=public
          JWT_SECRET: ci-test-secret-not-for-real-use
          JWT_EXPIRES_IN_SECONDS: 43200
          ERP_WEBHOOK_API_KEY: ci-test-erp-key

      - name: client — lint
        run: npm run lint -w client
      - name: client — typecheck
        run: npx tsc --noEmit -p client
      - name: client — test (con umbral de cobertura)
        run: npm run test:cov -w client
      - name: client — build
        run: npm run build -w client
